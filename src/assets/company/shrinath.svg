<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" style="background-color: #fed894;">
  <!-- Arch -->
  <path d="M 80,180 v -70 a 70,70 0 0,1 140,0 v 70" fill="none" stroke="#524337" stroke-width="4"/>
  <line x1="70" y1="180" x2="230" y2="180" stroke="#524337" stroke-width="4"/>
  
  <!-- Painting -->
  <rect x="130" y="80" width="40" height="30" fill="#524337"/>
  <circle cx="150" cy="90" r="5" fill="#fed894"/>
  <path d="M 130,110 l 10,-10 l 10,10 l 10,-10 l 10,10" fill="none" stroke="#fed894" stroke-width="2"/>

  <!-- Lamp -->
  <path d="M 100,120 l 10,-15 l 10,15 z" fill="#524337"/>
  <line x1="110" y1="120" x2="110" y2="175" stroke="#524337" stroke-width="4"/>
  
  <!-- Couch -->
  <path d="M 120,150 h 60 v 10 a 5,5 0 0,1 -5,5 h -50 a 5,5 0 0,1 -5,-5 z" fill="none" stroke="#524337" stroke-width="4"/>
  <rect x="125" y="140" width="22" height="10" fill="#524337"/>
  <rect x="153" y="140" width="22" height="10" fill="#524337"/>
  <line x1="130" y1="165" x2="125" y2="178" stroke="#524337" stroke-width="4"/>
  <line x1="170" y1="165" x2="175" y2="178" stroke="#524337" stroke-width="4"/>
  <line x1="115" y1="160" x2="185" y2="160" stroke="#524337" stroke-width="4"/>

  <!-- Plant -->
  <path d="M 200,145 l -8,25 h 16 z" fill="#524337"/>
  <line x1="196" y1="170" x2="192" y2="178" stroke="#524337" stroke-width="3"/>
  <line x1="204" y1="170" x2="208" y2="178" stroke="#524337" stroke-width="3"/>
  <path d="M 200,145 c -10,-10 -5,-25 0,-25 c 5,0 10,15 0,25" fill="#524337"/>
  <path d="M 200,140 c 15,-5 20,-15 15,-20 c -5,-5 -15,5 -15,20" fill="#524337"/>

  <!-- Text -->
  <text x="150" y="215" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#524337" text-anchor="middle" letter-spacing="2">SHRINATH FURNITURE</text>
  <text x="150" y="235" font-family="Arial, sans-serif" font-size="10" fill="#524337" text-anchor="middle" letter-spacing="1">HOME DECORATION</text>
</svg>
